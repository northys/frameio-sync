[project]
name = "frameio-sync"
version = "0.1.0"
description = "Download new photos from Frame.io into Google Photos or Immich"
authors = [
    { name = "northys", email = "northys@pm.me" }
]
requires-python = ">=3.13"
dependencies = [
    "frameio>=4.0.0",
    "google-auth>=2.62.0",
    "google-auth-oauthlib>=1.5.0",
    "requests>=2.34.2",
]

[project.scripts]
frameio-sync = "frameio_sync.cli:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
